<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이어폰 A/B Test</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
padding-top:50px;
}

.card{
background:white;
padding:20px;
width:300px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.discount{
background:red;
color:white;
padding:8px;
border-radius:20px;
font-weight:bold;
}

.price{
font-size:24px;
font-weight:bold;
color:red;
}

button{
background:black;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>프리미엄 무선 이어폰</h2>

<p>★★★★★ (4.8)</p>

<div class="discount">
5% 할인
</div>

<br>

<p><del>100,000원</del></p>

<div class="price">
95,000원
</div>

<br>

<button>
상세보기
</button>

</div>

</body>
</html>
