<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMall - Gift Version</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f6f7fb;
}

header{
background:white;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
}

.logo{
font-size:36px;
font-weight:bold;
color:#1f66ff;
}

.search{
width:50%;
padding:15px;
border-radius:15px;
border:1px solid #ddd;
}

.nav{
background:white;
display:flex;
justify-content:center;
gap:60px;
padding:20px;
font-weight:bold;
border-bottom:1px solid #ddd;
}

.container{
display:flex;
padding:50px;
gap:60px;
align-items:center;
}

.left{
width:45%;
}

.left img{
width:100%;
max-width:500px;
}

.right{
width:55%;
}

.title{
font-size:60px;
font-weight:bold;
margin-bottom:20px;
}

.price{
font-size:40px;
color:#333;
font-weight:bold;
}

.gift{
font-size:48px;
font-weight:bold;
color:#1f66ff;
margin-left:20px;
}

.line{
margin:20px 0;
height:1px;
background:#ddd;
}

.big-gift{
font-size:60px;
font-weight:bold;
color:#1f66ff;
margin-top:20px;
}

.message{
font-size:50px;
font-weight:bold;
}

.blue-box{
margin-top:30px;
background:#edf4ff;
padding:25px;
font-size:30px;
font-weight:bold;
color:#1f66ff;
border-radius:15px;
}

.buy-btn{
display:block;
margin-top:25px;
text-decoration:none;
text-align:center;
background:#1565ff;
color:white;
padding:30px;
border-radius:20px;
font-size:35px;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<div class="logo">
🛒 ShopMall
</div>

<input class="search" placeholder="찾고 싶은 상품을 검색해보세요!">

</header>

<div class="nav">

<div>전체 카테고리</div>
<div>베스트</div>
<div>신상품</div>
<div>특가상품</div>
<div>이벤트</div>
<div>고객센터</div>

</div>

<div class="container">

<div class="left">

<img src="airphone.png">

</div>

<div class="right">

<div class="title">
AirPods
</div>

<div>

<span class="price">
100,000원
</span>

<span class="gift">
20,000원 상당 사은품 증정
</span>

</div>

<div class="line"></div>

<div class="message">
지금 구매 시
</div>

<div class="big-gift">
20,000원 상당 사은품 증정
</div>

<div class="blue-box">
🎁 지금 쇼핑하기
</div>

<a href="#" class="buy-btn">
🛒 지금 구매하기
</a>

</div>

</div>

</body>
</html>
